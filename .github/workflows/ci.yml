name: CI

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Unit tests and dev debug build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Setup JDK
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          # The action defaults to "tools platform-tools", but the legacy
          # `tools` package is no longer served by the SDK repo and the
          # install step fails before any build runs.
          packages: platform-tools

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Cache Gradle
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Check code formatting
        run: ./gradlew -Dorg.gradle.java.home="$JAVA_HOME" ktlintCheck

      - name: Unit tests
        run: ./gradlew -Dorg.gradle.java.home="$JAVA_HOME" testDevDebugUnitTest

      - name: Decode stable debug keystore when available
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${DEBUG_KEYSTORE_BASE64:-}" ]; then
            echo "DEBUG_KEYSTORE_BASE64 unset; APKs will use the runner debug keystore."
            exit 0
          fi
          echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/pomo-debug.keystore"
          {
            echo "POMO_KEYSTORE_FILE=$RUNNER_TEMP/pomo-debug.keystore"
            echo "POMO_KEYSTORE_PASSWORD=android"
            echo "POMO_KEY_ALIAS=androiddebugkey"
            echo "POMO_KEY_PASSWORD=android"
          } >> "$GITHUB_ENV"

      - name: Build debug APKs
        run: ./gradlew -Dorg.gradle.java.home="$JAVA_HOME" assembleDevDebug assembleProdDebug
        env:
          CI_COMMIT_SHA: ${{ github.sha }}
          CI_REF_NAME: ${{ github.ref_name }}

      - name: Verify APK signatures
        shell: bash
        run: |
          set -euo pipefail
          APKSIGNER="${ANDROID_SDK_ROOT:-$ANDROID_HOME}/build-tools/35.0.0/apksigner"
          "$APKSIGNER" verify --verbose --print-certs app/build/outputs/apk/dev/debug/app-dev-debug.apk
          "$APKSIGNER" verify --verbose --print-certs app/build/outputs/apk/prod/debug/app-prod-debug.apk

  extension-check:
    name: Extension typecheck, tests, and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: latest

      - name: Cache bun dependencies
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('extension/bun.lock', 'extension/package.json') }}

      - name: Install dependencies
        working-directory: extension
        run: bun install

      - name: Typecheck
        working-directory: extension
        run: bunx tsc --noEmit

      - name: Tests
        working-directory: extension
        run: bun test

      - name: Build
        working-directory: extension
        run: bun run build

  omarchy-plugin-check:
    name: Omarchy plugin tests
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Tests
        run: python3 -m unittest discover -s omarchy-plugin/tests -v
